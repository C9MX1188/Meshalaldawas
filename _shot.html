<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>shot</title>
<style>html,body{margin:0;padding:0;overflow:hidden}iframe{width:100%;height:100vh;border:0;display:block}</style></head>
<body>
<iframe id="f" src="index.html"></iframe>
<script>
var f = document.getElementById('f');
f.addEventListener('load', function(){
  var w = f.contentWindow, d = f.contentDocument;
  var go = function(){
    var el = d.getElementById('certificates');
    if (el) { w.scrollTo(0, el.getBoundingClientRect().top + w.scrollY + 60); }
  };
  setTimeout(go, 600);
  setTimeout(go, 1400);
  setTimeout(go, 2400);
});
</script>
</body></html>
