<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101c2c">
<meta name="robots" content="noindex">
<title>الصفحة غير موجودة — مشعل الدواس</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>
  .nf-wrap{
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    text-align: center;
    padding: 40px 24px;
  }
  .nf-code{
    font-family:'IBM Plex Mono', monospace;
    font-size: clamp(3.4rem, 14vw, 6rem);
    line-height: 1;
    color: var(--amber);
    letter-spacing: 0.04em;
  }
  .nf-wrap h1{ font-size: 1.5rem; max-width: none; }
  .nf-wrap p{ color: var(--paper-dim); max-width: 44ch; }
  .nf-links{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:10px; }
</style>
</head>
<body>
<main class="nf-wrap">
  <span class="nf-code">404</span>
  <h1>هذه الصفحة غير موجودة</h1>
  <p>الرابط الذي فتحته غير صحيح أو تم نقله. ارجع للصفحة الرئيسية وتصفّح المسار والمشاريع والشهادات.</p>
  <div class="nf-links">
    <a class="cv-download" href="index.html">
      <span>الصفحة الرئيسية</span>
      <span class="cv-download-icon" aria-hidden="true">←</span>
    </a>
    <a class="ghost-btn" href="index.html#contact">تواصل معي</a>
  </div>
</main>
</body>
</html>
